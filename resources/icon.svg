<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="60%" stop-color="#00cc66"/>
      <stop offset="100%" stop-color="#004422"/>
    </radialGradient>
    <radialGradient id="portalCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001a0d"/>
      <stop offset="70%" stop-color="#003319"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </radialGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="256" cy="256" r="240" fill="#003319" opacity="0.5"/>

  <!-- Main portal circle -->
  <circle cx="256" cy="256" r="220" fill="url(#portalGlow)"/>

  <!-- Spiral arms -->
  <g fill="none" stroke="#00ff88" stroke-width="12" stroke-linecap="round" opacity="0.8">
    <path d="M256,256 Q320,180 380,200 T440,280"/>
    <path d="M256,256 Q180,320 200,380 T280,440"/>
    <path d="M256,256 Q192,180 132,200 T72,280"/>
    <path d="M256,256 Q320,332 300,392 T220,440"/>
  </g>

  <!-- Inner swirl details -->
  <g fill="none" stroke="#66ffaa" stroke-width="8" stroke-linecap="round" opacity="0.6">
    <path d="M256,256 Q290,200 340,220"/>
    <path d="M256,256 Q200,290 220,340"/>
    <path d="M256,256 Q222,200 172,220"/>
    <path d="M256,256 Q312,290 292,340"/>
  </g>

  <!-- Center dark void -->
  <circle cx="256" cy="256" r="60" fill="url(#portalCenter)"/>

  <!-- Highlight spots -->
  <circle cx="200" cy="180" r="15" fill="#99ffcc" opacity="0.4"/>
  <circle cx="340" cy="220" r="10" fill="#99ffcc" opacity="0.3"/>
  <circle cx="180" cy="320" r="12" fill="#99ffcc" opacity="0.35"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00ff88" stroke-width="6" opacity="0.7"/>
  <circle cx="256" cy="256" r="245" fill="none" stroke="#00cc66" stroke-width="3" opacity="0.4"/>
</svg>
